[package]
name = "thumper"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Anthony Gardner"]
description = "A lightweight heartbeat-based task liveness monitor with fixed and learned timing"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Gardlok/thumper"
homepage = "https://github.com/Gardlok/thumper"
documentation = "https://docs.rs/thumper"
keywords = ["heartbeat", "health-check", "liveness", "monitoring", "reliability"]
categories = ["concurrency", "development-tools::debugging"]
include = ["src/**/*", "tests/**/*", "examples/**/*", "README.md", "LICENSE"]
publish = false

[lib]
name = "thumper"
path = "src/lib.rs"

[dependencies]
